<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Impostor Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: Arial; text-align: center; padding: 20px; font-size: 22px; }
h1 { font-size: 36px; }
h2 { font-size: 28px; }

input, button {
  padding: 14px;
  margin: 8px;
  font-size: 22px;
  width: 90%;
  max-width: 360px;
}

.hidden { display: none; }
.player-button { display:block; margin:10px auto; font-size:24px; }
.player-button:disabled { background:#ccc; }

.scoreboard { margin-bottom:15px; font-size:20px; }
.timer { font-size:48px; margin:20px; }
.category { font-weight:bold; font-size:24px; }
.target { color:darkred; font-size:24px; }
</style>
</head>

<body>
<h1>Impostor Game</h1>

<div id="setup">
  <h2>Add Players</h2>
  <input id="nameInput" placeholder="Player name">
  <button type="button" onclick="addPlayer()">Add Player</button>
  <ul id="playerList"></ul>
  <button type="button" onclick="startGame()">Start Game</button>
</div>

<div id="playerSelect" class="hidden">
  <div class="scoreboard" id="scoreboard"></div>
  <h2>Select Your Name</h2>
  <div id="playerButtons"></div>
  <button type="button" onclick="startStarterScreen()">Continue</button>
</div>

<div id="revealScreen" class="hidden">
  <h2 id="revealTitle"></h2>
  <div class="category" id="categoryText"></div>
  <div id="revealText"></div>
  <div class="target" id="targetText"></div>
  <button type="button" onclick="backToSelection()">Done</button>
</div>

<div id="starterScreen" class="hidden">
  <h2>Starting Player</h2>
  <div style="font-size:40px;" id="starterName"></div>
  <button type="button" onclick="startDiscussion()">Start Discussion</button>
</div>

<div id="timerScreen" class="hidden">
  <h2 id="timerTitle"></h2>
  <div class="timer" id="timerDisplay"></div>
  <button type="button" onclick="skipTimer()">Skip Countdown</button>
</div>

<div id="voteScreen" class="hidden">

<h2>Who was voted out?</h2>

<div id="voteButtons"></div>

<button onclick="skipRound()">
Skip Round
</button>

</div>

<div id="guessResult" class="hidden">

<h2>Did an impostor guess the word?</h2>

<button onclick="finishRound(true)">
Yes
</button>

<button onclick="finishRound(false)">
No
</button>

</div>
  
<script>
let players = [];
let scores = {};
let data = [];
let usedWords = {};
let impostorHistory = {};

let currentRound = {
    impostors: [],
    target: "",
    starter: "",
    category: "",
    word: "",
    hint: "",
    vote: null,
    guessedWord: false,
    historyApplied: false
};

let viewedPlayers = new Set();
let timerInterval = null;
let currentTimerPhase = "";

fetch("Impostor.json")
.then(r=>r.json())
.then(json=>{
  data=json;
  data.forEach(o=>usedWords[Object.keys(o)[0]]=new Set());
});

function addPlayer(){
  const input=document.getElementById("nameInput");
  const list=document.getElementById("playerList");
  const n=input.value.trim();
  if(!n||players.includes(n))return;

  players.push(n);
  scores[n]=0;
  impostorHistory[n]=[];

  const li=document.createElement("li");
  li.textContent=n;
  list.appendChild(li);
  input.value="";
}

function startGame(){
  if(players.length<3){alert("Need 3+ players");return;}
  document.getElementById("setup").classList.add("hidden");
  newRound();
  if (data.length === 0) {
    alert("Words are still loading. Please wait a second and try again.");
    return;
}
}

function newRound(){
  console.log("newRound started");
  currentRound = {

    impostors: [],

    target: "",

    starter: "",

    category: "",

    word: "",

    hint: "",

    vote: null,

    guessedWord: false,

    historyApplied: false

};
  viewedPlayers.clear();

  let pool=[];
  players.forEach(p=>{
    let last5=impostorHistory[p].slice(-5);
    let count=last5.filter(x=>x).length;
    let wasLast=last5[last5.length-1]===true;
    if(count>=2)return;

    if(!wasLast) for(let i=0;i<5;i++) pool.push(p);
    else pool.push(p);
  });
  if(pool.length===0) pool=[...players];
  const impostorCount =
    players.length > 6 ? 2 : 1;

const selectionPool = [...pool];
  
if(new Set(selectionPool).size < impostorCount){

    selectionPool.length = 0;

    players.forEach(player => selectionPool.push(player));

}

while (
    currentRound.impostors.length < impostorCount &&
    selectionPool.length > 0
) {

    const index =
        Math.floor(Math.random()*selectionPool.length);

    const pick = selectionPool[index];

    if(!currentRound.impostors.includes(pick)){

        currentRound.impostors.push(pick);

        for(let i=selectionPool.length-1;i>=0;i--){

            if(selectionPool[i]===pick)
                selectionPool.splice(i,1);

        }

    }

}
  console.log(currentRound.impostors);
  const innocentPlayers = players.filter(player =>
    !currentRound.impostors.includes(player)
);

  currentRound.target =
      innocentPlayers[Math.floor(Math.random()*innocentPlayers.length)];
  console.log(currentRound.target);
  
  pickWord();
  console.log(currentRound.word);
  updateScoreboard();
  createButtons();
  
  document.getElementById("voteScreen").classList.add("hidden");
  document.getElementById("guessResult").classList.add("hidden");
  document.getElementById("playerSelect").classList.remove("hidden");
}
function commitHistory(){

    if(currentRound.historyApplied) return;

    players.forEach(player=>{

        const wasImpostor =
            currentRound.impostors.includes(player);

        impostorHistory[player].push(wasImpostor);

        if(impostorHistory[player].length>5)
            impostorHistory[player].shift();

    });

    currentRound.historyApplied=true;





}

function pickWord() {

    if (data.length === 0) {
        console.error("JSON not loaded.");
        return;
    }

    // Pick a random category
    const obj = data[Math.floor(Math.random() * data.length)];

    currentRound.category = Object.keys(obj)[0];

    const words = obj[currentRound.category];

    const availableWords = Object.keys(words).filter(
        word => !usedWords[currentRound.category].has(word)
    );

    if (availableWords.length === 0) {
        usedWords[currentRound.category].clear();

        availableWords.push(...Object.keys(words));
    }

    currentRound.word =
        availableWords[Math.floor(Math.random() * availableWords.length)];
    
    currentRound.hint =
        words[currentRound.word];
    
    alert("Category = " + currentRound.category);
    alert("Word = " + currentRound.word);
    alert("Hint = " + currentRound.hint);

    usedWords[currentRound.category].add(currentRound.word);

    console.log(currentRound);
  alert(JSON.stringify(obj));
}

function updateScoreboard(){
  document.getElementById("scoreboard").innerHTML="Scores:<br>"+players.map(p=>`${p}: ${scores[p]}`).join(" | ");
}

function createButtons(){
  const div=document.getElementById("playerButtons");
  div.innerHTML="";
  players.forEach(p=>{
    let b=document.createElement("button");
    b.type="button"; b.textContent=p; b.className="player-button";
    b.onclick=()=>reveal(p,b);
    div.appendChild(b);
  });
}

function reveal(p,b){
  if(viewedPlayers.has(p))return;
  viewedPlayers.add(p); b.disabled=true;
  document.getElementById("playerSelect").classList.add("hidden");
  document.getElementById("revealScreen").classList.remove("hidden");

  document.getElementById("categoryText").textContent=`Category: ${currentRound.category}`;
  document.getElementById("targetText").textContent="";

  if(currentRound.impostors.includes(p)){
    document.getElementById("revealTitle").textContent="You are the IMPOSTOR";
    document.getElementById("revealText").textContent=`Hint: ${currentRound.hint}`;
    document.getElementById("targetText").textContent=`Target: ${currentRound.target}`;
  }else{
    document.getElementById("revealTitle").textContent="You know the word";
    document.getElementById("revealText").textContent=`Word: ${currentRound.word}`;
  }
}

function backToSelection(){
  document.getElementById("revealScreen").classList.add("hidden");
  document.getElementById("playerSelect").classList.remove("hidden");
}

function startStarterScreen(){
  currentRound.starter =
    players[Math.floor(Math.random()*players.length)];
  document.getElementById("playerSelect").classList.add("hidden");
  document.getElementById("starterScreen").classList.remove("hidden");
  document.getElementById("starterName").textContent=currentRound.starter;
}

function startDiscussion(){
  document.getElementById("starterScreen").classList.add("hidden");
  startTimer(300,"Discussion & Voting");
}

function startTimer(sec,title){
  clearInterval(timerInterval);
  currentTimerPhase=title;
  document.getElementById("timerScreen").classList.remove("hidden");
  document.getElementById("timerTitle").textContent=title;
  let t=sec; updateTimer(t);
  timerInterval=setInterval(()=>{
    t--; updateTimer(t);
    if(t<=0){clearInterval(timerInterval); handleTimerEnd();}
  },1000);
}

function updateTimer(t){
  document.getElementById("timerDisplay").textContent=`${Math.floor(t/60)}:${(t%60).toString().padStart(2,"0")}`;
}

function skipTimer(){ clearInterval(timerInterval); handleTimerEnd(); }

function handleTimerEnd(){
  if(currentTimerPhase==="Discussion & Voting")
    startTimer(120,"Impostor Guess");
  else {

    document.getElementById("timerScreen")
        .classList.add("hidden");

    showVoteScreen();

    document.getElementById("voteScreen")
        .classList.remove("hidden");

  }
}
function showVoteScreen(){

    const div=document.getElementById("voteButtons");

    div.innerHTML="";

    players.forEach(player=>{

        let b=document.createElement("button");

        b.textContent=player;

        b.onclick=()=>recordVote(player);

        div.appendChild(b);

    });

}
  function recordVote(player){

    currentRound.vote = player;

    document.getElementById("voteScreen")
    .classList.add("hidden");

    document.getElementById("guessResult").classList.remove("hidden");

}

function skipRound(){

    document.getElementById("voteScreen")
        .classList.add("hidden");

    document.getElementById("guessResult")
        .classList.add("hidden");

    newRound();

}
function finishRound(guessed){

    currentRound.guessedWord = guessed;

    commitHistory();

    const voted =
        currentRound.vote;

    const impostors =
        currentRound.impostors;

    if(impostors.includes(voted)){

        players.forEach(player=>{

            if(!impostors.includes(player))
                scores[player]+=5;

        });

    }

    else if(voted===currentRound.target){

        if(guessed){

            const points =
                impostors.length===2 ? 30 : 45;

            impostors.forEach(player=>
                scores[player]+=points
            );

        }

        else{

            impostors.forEach(player=>
                scores[player]+=15
            );

        }

    }

    updateScoreboard();



    newRound();

}
</script>
</body>
</html>
